# Call of Minecraft: Zombies — WeaponMechanics weapon definitions (GENERATED).
#
# Bundled in the COM:Z jar and copied into <WeaponMechanics>/weapons/ on first launch
# (WMConfigInstaller). Loaded ONLY when WeaponMechanics is installed; COM:Z works without it.
#
# Generated by scratchpad/gen_wm.py from guns.json. Wonder weapons (Ray Gun, Thundergun,
# Wunderwaffe) are intentionally NOT mapped — their custom effects require the native path.
#
# Hit damage, points, headshots and round scaling are applied by COM:Z (WMDamageListener),
# NOT by the Base_Damage below. TODO(model): wire COM:Z resource-pack 3D models once the WM
# Weapon_Item model key is verified on a live server; for now the gun's material is used.

