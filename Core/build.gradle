import org.apache.tools.ant.filters.ReplaceTokens

apply plugin: 'idea'
apply plugin: 'maven-publish'

archivesBaseName = "comzombies-Universal"

repositories {
    mavenCentral()
    maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url 'https://oss.sonatype.org/content/repositories/central' }
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation project(':API')
    compileOnly "com.github.MilkBowl:VaultAPI:1.7.1"
    implementation group: 'org.spigotmc', name: 'spigot-api', version: '26.2-R0.1-SNAPSHOT'
    implementation 'me.clip:placeholderapi:2.11.6'
    // JSR-305 (javax.annotation.Nonnull) used to arrive transitively via spigot-api; 26.2 dropped it.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    // WeaponMechanics — OPTIONAL soft-dependency for realistic 3D models + ballistic projectiles.
    // compileOnly => NOT shaded into comzombies-Universal.jar, so the plugin still builds and runs
    // when WM is absent. All WM-typed code is isolated in com.theprogrammingturkey.comz.integration.wm
    // and only loaded after runtime detection (see COMZombies.onEnable / WeaponBackends).
    compileOnly 'com.cjcrafter:weaponmechanics:4.1.0'
    // MechanicsCore — WM's shared base (me.deecaad.core.*). Needed at compile time to resolve the
    // WeaponMechanics plugin's superclass on the API call chain. Also compileOnly (provided by WM).
    compileOnly 'com.cjcrafter:mechanicscore:4.1.0'

}

// WeaponMechanics 4.x ships Java 21 bytecode, but we target Java 17 (options.release = 17), so
// Gradle's variant matching would reject it on the compile classpath. WM is compileOnly — never
// shaded or run by us — so we only need its class files visible to javac. Raise the ACCEPTED jvm
// version on the compile classpath to 21 (a consumer needing 21 still accepts the Java-17 spigot-api
// and friends). The emitted bytecode is unaffected; options.release = 17 still governs our output.
configurations.compileClasspath {
    attributes {
        attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
    }
}

jar {
    from project(":API").sourceSets.main.output.classesDirs
}

processResources {
    from(sourceSets.main.resources.srcDirs) {
        filter ReplaceTokens, tokens: [
                "version": project.version.toString()
        ]
        duplicatesStrategy = 'INCLUDE'
    }
}