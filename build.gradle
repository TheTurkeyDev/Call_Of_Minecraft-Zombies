ext.buildnumber = 0
if (System.getenv('BUILD_NUMBER') != null) {
    project.buildnumber = Integer.parseInt(System.getenv('BUILD_NUMBER'))
} else {
    project.buildnumber = 'DEV'
    logger.lifecycle "No build number detected, setting to 0"
}

allprojects {
    group = 'comz'
    version = "2.3.${buildnumber}"
    logger.lifecycle "${project.version}"
}

subprojects {
    apply plugin: 'java'

    // spigot-api 26.2 ships Java 17 bytecode. Build with JDK >= 17 and target 17 so
    // the plugin compiles anywhere and runs on the Java 25 server that 26.2 requires.
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenLocal()
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 17
    }
}